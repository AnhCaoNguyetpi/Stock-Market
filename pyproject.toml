[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vietnam-stock-market"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "openpyxl>=3.1,<4",
  "scikit-learn>=1.4,<2", "lightgbm>=4.3,<5", "joblib>=1.3,<2",
  "PyYAML>=6,<7", "python-dotenv>=1.0,<2"
]

[project.scripts]
stock-market = "stock_market.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

